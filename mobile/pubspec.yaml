name: icspp_mobile
description: ICSPP Unity Mobile App for members, leaders and admins.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  dio: ^5.4.0
  
  # Secure Storage
  flutter_secure_storage: ^9.0.0

  # State Management
  provider: ^6.1.2

  # Routing
  go_router: ^13.2.0

  # Images
  cached_network_image: ^3.3.1

  # Charts
  fl_chart: ^0.68.0

  # Grid Layout
  flutter_staggered_grid_view: ^0.7.0

  # Date / Formatting
  intl: ^0.19.0

  # Loading Skeletons
  shimmer: ^3.0.0

  # Fonts
  google_fonts: ^6.2.1

  # URL / File launching
  url_launcher: ^6.2.6

  # QR Code for attendance
  qr_flutter: ^4.1.0

  # Image Picker for profile/uploads
  image_picker: ^1.0.7

  # Shared Preferences (non-sensitive fallback)
  shared_preferences: ^2.2.3

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
