version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ppics_db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_DATABASE: ${DB_NAME:-icspp}
    ports:
      - "3307:3306" # Exposing on 3307 to avoid conflict with local MySQL
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

  backend:
    build: 
      context: ./backend-python
    container_name: ppics_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-1234}
      - DB_NAME=${DB_NAME:-icspp}
      - DB_PORT=3306
      - JWT_SECRET=your-super-secret-key-change-this
    depends_on:
      - db
    volumes:
      - ./backend-python/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend_flutter
    container_name: ppics_frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
